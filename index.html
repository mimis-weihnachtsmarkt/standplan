:root{
  /* Farben und Schrift 1:1 von mimis-weihnachtsmarkt.ch (style.css), Kartenfarben 1:1 aus Mirjams Standplan */
  --brand-blue:#1e213a;
  --brand-light-blue:#0d3958;
  --brand-yellow:#fbab28;
  --brand-red:#bd1733;
  --brand-white:#ffffff;
  --brand-font:"Metropolis",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --plan-wiese:#d4e5b0; --plan-weg:#ffffff; --plan-haus:#baca9b; --plan-stand:#1a3550; --plan-info:#7fb837;
  --schweine:#8957b1; --ziegen:#5e6b96; --pferde:#859762; --enten:#f68199; --huehner:#5d909f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--brand-blue);color:var(--brand-white);font-family:var(--brand-font);font-weight:300;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--brand-yellow);outline-offset:2px}
::selection{background:var(--brand-white);color:var(--brand-blue)}
[hidden]{display:none!important}

/* Hintergrund mit Schnee wie auf der Website */
.schnee{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at bottom,#1e213a 0%,#0d3958 100%)}
.schnee i{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:fall linear infinite;will-change:transform}
@keyframes fall{to{transform:translate3d(var(--dx),calc(100vh + 24px),0)}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}

/* Kopf */
.kopf{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px 12px;text-align:left}
.kopf img{flex:none;height:78px;width:auto;display:block}
.kopf h1{margin:0;font-size:25px;line-height:1.15;font-weight:700;text-transform:uppercase}
.kopf p{margin:3px 0 0;font-size:14.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.kopf p span{display:block;white-space:nowrap}

/* Karte */
.karte{flex:none;position:relative;background:var(--plan-wiese);height:46%;height:min(76.73vw,46%);overflow:hidden}
#map{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab}
#map:active{cursor:grabbing}
#map text{font-family:var(--brand-font);font-weight:700;font-size:12px;text-anchor:middle;pointer-events:none;fill:#fff}
.ground{fill:var(--plan-wiese)}
.road{fill:none;stroke:var(--plan-weg);stroke-width:38.27;stroke-linejoin:miter;stroke-miterlimit:10}
.road.plaza{fill:var(--plan-weg)}
.bld{fill:var(--plan-haus)}
.z-schweine{fill:var(--schweine)} .z-ziegen{fill:var(--ziegen)} .z-pferde{fill:var(--pferde)} .z-enten{fill:var(--enten)} .z-huehner{fill:var(--huehner)}
.svc path{fill:var(--plan-info)}
.tier{fill:#fff;pointer-events:none}
.svc .arrow path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.st{cursor:pointer}
.st .hit{fill:none;stroke:transparent;stroke-width:9;pointer-events:all}
.st .box{fill:var(--plan-stand)}
.st.sm text,.st text.two{font-size:10.5px}
.st.sel .box{fill:var(--brand-yellow);stroke:var(--brand-blue);stroke-width:2}
#map .st.sel text{fill:var(--brand-blue)}
.zone.sel,.svc.sel path{stroke:var(--brand-yellow);stroke-width:5}
.ping{fill:none;stroke:var(--brand-red);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 3.6s ease-out infinite;pointer-events:none}
@keyframes ping{0%{transform:scale(.6);opacity:0}15%{opacity:.9}100%{transform:scale(1.35);opacity:0}}

.zoom{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zoom button{width:38px;height:38px;border:0;border-radius:50%;background:var(--brand-blue);color:#fff;font-size:22px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.zoom button svg{width:18px;height:18px}
.info{position:absolute;left:8px;right:100px;bottom:8px;pointer-events:none;display:flex}
.info.oben{bottom:auto;top:8px;right:8px}
.karte.gezoomt .info.oben{right:150px}
.info .karte-info{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;background:var(--brand-blue);color:#fff;border-radius:22px;padding:7px 7px 6px 14px;font-size:15px;line-height:1.25}
.ganz{position:absolute;right:8px;top:8px;height:38px;padding:2px 16px 0;border:0;border-radius:40px;background:var(--brand-blue);color:#fff;font-weight:700;font-size:15px}
.info .zeilen{display:grid;gap:3px;min-width:0}
.info .zeile{display:flex;gap:8px;align-items:baseline;min-width:0}
.info .nr{flex:none;color:var(--brand-yellow);font-weight:700;font-variant-numeric:tabular-nums}
.info .nm{overflow-wrap:anywhere}
.info .zu{flex:none;width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:transparent;color:#fff;font-size:18px;font-weight:700;line-height:1;padding:0}
.info .tipp{background:var(--brand-blue);color:#fff;border-radius:40px;padding:6px 12px 5px;font-size:13px;line-height:1.25}

/* Suche: Felder und Knöpfe wie die Buttons der Website */
.suche{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 16px 10px}
.feld{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 16px;border:2px solid #fff;border-radius:40px}
.feld:focus-within{border-color:var(--brand-yellow)}
.feld svg{flex:none;width:18px;height:18px}
.feld input{flex:1;min-width:0;height:100%;padding:2px 0 0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;color:#fff;-webkit-appearance:none;appearance:none}
.feld input::placeholder{color:rgba(255,255,255,.75)}
.feld input::-webkit-search-cancel-button{-webkit-appearance:none}
.feld .leeren{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:#fff;color:var(--brand-blue);font-size:18px;font-weight:700;line-height:1;padding:0}
.fertig,.chip{border:2px solid #fff;border-radius:40px;background:transparent;color:#fff;font-weight:700}
.fertig{height:46px;padding:2px 16px 0;font-size:15px}
.chips{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:2px 10px 0;font-size:13.5px}
.chip[aria-pressed="true"]{background:#fff;color:var(--brand-blue)}

/* Liste: Nummer fett, Name leicht, wie die Legende auf dem Plan */
.liste{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px 24px}
.liste h2{margin:14px 0 4px;font-size:15px;font-weight:700;text-transform:uppercase}
.liste ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:8px 14px 6px 8px;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:none;text-align:left}
.row .no{flex:none;width:28px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.row .sw{flex:none;width:18px;height:18px;margin:0 5px 2px;border-radius:4px}
.row .nm{min-width:0;overflow-wrap:anywhere}
.row.sel{background:#fff;color:var(--brand-blue);border-bottom-color:transparent;border-radius:40px}
.row.sel .nm{font-weight:700}
.row:focus-visible{outline-offset:-3px}
.leer{margin:18px 0}
.fuss{margin:26px 0 0;font-size:15px;text-align:center}
.fuss p{margin:0 0 6px}
.fuss a{color:#fff;font-weight:700;text-decoration:none;border-bottom:1px solid}

/* Beim Tippen auf dem Handy: Platz für die Treffer */
.app.tippt .kopf,.app.tippt .karte,.app.tippt .chips{display:none}

@media (min-width:900px),(orientation:landscape) and (min-width:600px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,34%,380px);grid-template-rows:auto auto minmax(0,1fr)}
  .kopf{grid-column:1/-1}
  .karte{grid-column:1;grid-row:2/4;height:auto}
  .suche{grid-column:2;grid-row:2}
  .liste{grid-column:2;grid-row:3}
}
@supports (aspect-ratio:1/1){
  @media (min-width:900px),(orientation:landscape) and (min-width:600px){
    .karte{align-self:start;aspect-ratio:842/646;max-height:100%}
  }
}
@media (min-width:900px) and (min-height:560px){
  .kopf{padding:16px 24px 18px;gap:20px}
  .kopf img{height:112px}
  .kopf h1{font-size:40px}
  .kopf p{font-size:18px}
  .kopf p span{display:inline;margin-right:14px}
}
@media (max-height:640px){
  .kopf{padding:6px 16px 8px;gap:10px}
  .kopf img{height:50px}
  .kopf h1{font-size:21px}
  .kopf p{font-size:13px;margin-top:1px}
  .kopf p span{display:inline;margin-right:10px}
  .suche{padding:8px 16px 8px}
  .liste h2{margin-top:8px}
}
@media (max-height:640px) and (orientation:portrait){
  .karte{height:42%;height:min(76.73vw,42%)}
}
@media (prefers-reduced-motion:reduce){.ping{animation:none}.schnee i{animation:none}}
</style>
</head>

  {key:"sitz",  name:"Sitzplätze",         such:"sitzplatz sitzen essen bank tisch", ziel:[".svc[data-key=sitz1]",".svc[data-key=sitz2]"], art:"svc", kurz:"Sitz"},
  {key:"rauch", name:"Raucherbereich",     such:"rauchen raucher",                 ziel:[".svc[data-key=rauch]"], art:"svc", kurz:"Rauch"},
  {key:"schweine", name:"Schweine", such:"tiere schwein", ziel:[".zone[data-zone=schweine]"], art:"tier"},
  {key:"ziegen",   name:"Ziegen",   such:"tiere ziege",   ziel:[".zone[data-zone=ziegen]"],   art:"tier"},
  {key:"pferde",   name:"Pferde",   such:"tiere pferd",   ziel:[".zone[data-zone=pferde]"],   art:"tier"},
  {key:"enten",    name:"Enten",    such:"tiere ente",    ziel:[".zone[data-zone=enten]"],    art:"tier"},
  {key:"huehner",  name:"Hühner",   such:"tiere huhn hühner", ziel:[".zone[data-zone=huehner]"], art:"tier"}
];
const CHIPS = {wc:["wc","wcbf"], sitz:["sitz"], rauch:["rauch"], tiere:["schweine","ziegen","pferde","enten","huehner"]};

(function(){
  "use strict";
  const W = 841.89, H = 646, ZMAX = 7;
  const $ = (s, r) => (r || document).querySelector(s);
  const app = $("#app"), karte = $("#karte"), svg = $("#map"), pings = $("#pings"), info = $("#info");
  const q = $("#q"), leeren = $("#leeren"), fertig = $("#fertig"), liste = $("#liste");
  const ulS = $("#ul-staende"), ulH = $("#ul-hof"), ganz = $("#zall");
  const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---------- Karte: Stände nach Nummer ---------- */
  const standVon = new Map();
  svg.querySelectorAll(".st").forEach(g => g.dataset.nums.split(" ").forEach(n => standVon.set(+n, g)));

  /* ---------- Liste aufbauen ---------- */
  const rows = [];
  LEGENDE.forEach(([n, name]) => {
    const li = document.createElement("li");
    li.innerHTML = '<button type="button" class="row"><span class="no">' + n + '</span><span class="nm">' + esc(name) + "</span></button>";
    const b = li.firstChild;
    b.addEventListener("click", () => waehleStand(standVon.get(n), true));
    ulS.appendChild(li);
    rows.push({li, b, n, name, text: norm(n + " " + name)});
  });
  HOF.forEach(h => {
    const li = document.createElement("li");
    const badge = '<span class="sw" style="background:var(--' + (h.art === "svc" ? "plan-info" : h.key) + ')"></span>';
    li.innerHTML = '<button type="button" class="row">' + badge + '<span class="nm">' + esc(h.name) + "</span></button>";
    const b = li.firstChild;
    b.addEventListener("click", () => waehleHof([h.key], true));
    ulH.appendChild(li);
    rows.push({li, b, hof: h, text: norm(h.name + " " + h.such)});
  });

  /* ---------- Ansicht (Zoom und Verschieben über die viewBox) ---------- */
  let auswahl = [];
  let view = {cx: W / 2, cy: H / 2, z: 1}, box = {w: 1, h: 1, l: 0, t: 0}, s0 = 1, anim = 0;
  function messen(){
    const r = karte.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    box = {w: r.width, h: r.height, l: r.left, t: r.top};
    s0 = Math.min(box.w / W, box.h / H);
    return true;
  }
  function begrenzen(v){
    v.z = Math.min(ZMAX, Math.max(1, v.z));
    const s = s0 * v.z, w = box.w / s, h = box.h / s;
    v.cx = w >= W ? W / 2 : Math.min(W - w / 2, Math.max(w / 2, v.cx));
    v.cy = h >= H ? H / 2 : Math.min(H - h / 2, Math.max(h / 2, v.cy));
    return v;
  }
  function zeichnen(){
    begrenzen(view);
    const s = s0 * view.z, w = box.w / s, h = box.h / s;
    ganz.hidden = view.z <= 1.02;
    karte.classList.toggle("gezoomt", view.z > 1.02);
    svg.setAttribute("viewBox", (view.cx - w / 2).toFixed(2) + " " + (view.cy - h / 2).toFixed(2) + " " + w.toFixed(2) + " " + h.toFixed(2));
    infoPlatz();
  }
  function zuKarte(px, py){
    const s = s0 * view.z;
    return {x: view.cx + (px - box.l - box.w / 2) / s, y: view.cy + (py - box.t - box.h / 2) / s};
  }
  function zoomUm(px, py, faktor){
    cancelAnimationFrame(anim);
    const m = zuKarte(px, py);
    view.z = Math.min(ZMAX, Math.max(1, view.z * faktor));
    const s = s0 * view.z;
    view.cx = m.x - (px - box.l - box.w / 2) / s;
    view.cy = m.y - (py - box.t - box.h / 2) / s;
    zeichnen();
  }
  function fliegen(ziel, ms){
    cancelAnimationFrame(anim);
    ziel = begrenzen(Object.assign({}, ziel));
    if (ruhig || !ms){ view = ziel; zeichnen(); return; }
    const von = Object.assign({}, view), t0 = performance.now();
    const schritt = jetzt => {
      const k = Math.min(1, (jetzt - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      view = {cx: von.cx + (ziel.cx - von.cx) * e, cy: von.cy + (ziel.cy - von.cy) * e, z: von.z * Math.pow(ziel.z / von.z, e)};
      zeichnen();
      if (k < 1) anim = requestAnimationFrame(schritt);
    };
    anim = requestAnimationFrame(schritt);
  }
  /* Die Namens-Pille weicht aus, wenn sie das Ausgewählte verdecken würde */
  function infoPlatz(){
    const pille = info.firstElementChild;
    if (!pille || !auswahl.length){ info.classList.remove("oben"); return; }
    const s = s0 * view.z, x0 = view.cx - box.w / s / 2, y0 = view.cy - box.h / s / 2, rand = 16;
    const pw = pille.offsetWidth + 8 + rand, ph = pille.offsetHeight + 8 + rand;
    const trifft = oben => auswahl.some(b => {
      const l = (b.x - x0) * s, t = (b.y - y0) * s, r = l + b.w * s, u = t + b.h * s;
      if (r < 0 || l > box.w || u < 0 || t > box.h) return false;
      return l < pw && (oben ? t < ph : u > box.h - ph);
    });
    const oben = info.classList.contains("oben");
    if (trifft(oben) && !trifft(!oben)) info.classList.toggle("oben", !oben);
  }
  function rahmen(els){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    els.forEach(el => { const b = el.getBBox(); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); });
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(W, x1); y1 = Math.min(H, y1);
    return {x: x0, y: y0, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2};
  }
  function hinfliegen(els){
    if (!messen()) return;
    const r = rahmen(els);
    const breit = Math.max(r.w * 2.4, 320), hoch = Math.max(r.h * 2.4, 240);
    const z = Math.min(box.w / (s0 * breit), box.h / (s0 * hoch));
    fliegen({cx: r.cx, cy: r.cy, z}, 450);
  }

  /* ---------- Auswahl ---------- */
  function aufheben(){
    svg.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
    svg.classList.remove("has-sel");
    pings.textContent = "";
    auswahl = []; info.classList.remove("oben");
    rows.forEach(r => r.b.classList.remove("sel"));
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
    info.textContent = "";
  }
  function tipp(){
    info.innerHTML = '<div class="tipp">Stand antippen oder zoomen</div>';
  }
  function tippWeg(){ const t = $(".tipp", info); if (t) t.remove(); }
  function zeigeInfo(zeilen){
    info.innerHTML = '<div class="karte-info"><div class="zeilen">' + zeilen.map(z =>
      '<div class="zeile">' + (z.nr ? '<span class="nr">' + z.nr + "</span>" : "") + '<span class="nm">' + esc(z.name) + "</span></div>").join("") +
      '</div><button type="button" class="zu" aria-label="Auswahl aufheben">×</button></div>';
    $(".zu", info).addEventListener("click", () => aufheben());
    infoPlatz();
  }
  function markieren(els){
    svg.classList.add("has-sel");
    auswahl = els.map(el => { const b = el.getBBox(); return {x: b.x, y: b.y, w: b.width, h: b.height}; });
    els.forEach(el => {
      el.classList.add("sel");
      const b = el.getBBox(), c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("class", "ping");
      c.setAttribute("cx", (b.x + b.width / 2).toFixed(1)); c.setAttribute("cy", (b.y + b.height / 2).toFixed(1));
      c.setAttribute("r", (Math.max(b.width, b.height) / 2 + 10).toFixed(1));
      pings.appendChild(c);
    });
  }
  function sichtbarMachen(b){
    if (!b) return;
    const l = liste.getBoundingClientRect(), r = b.getBoundingClientRect();
    if (r.top < l.top || r.bottom > l.bottom) { const ziel = liste.scrollTop + r.top - l.top - 8; if (!ruhig && liste.scrollTo && "scrollBehavior" in document.documentElement.style) liste.scrollTo({top: ziel, behavior: "smooth"}); else liste.scrollTop = ziel; }
  }

  function waehleStand(g, ausListe){
    if (!g) return;
    tippenAus();
    aufheben();
    const nums = g.dataset.nums.split(" ").map(Number);
    markieren([g]);
    const treffer = rows.filter(r => r.n && nums.includes(r.n));
    treffer.forEach(r => r.b.classList.add("sel"));
    zeigeInfo(treffer.length ? treffer.map(r => ({nr: r.n, name: r.name})) : nums.map(n => ({nr: n, name: "Stand " + n})));
    if (q.value){ q.value = ""; filtern(); }
    sichtbarMachen(treffer[0] && treffer[0].b);
    hinfliegen([g]);
  }
  function waehleHof(keys, ausListe, chip){
    tippenAus();
    aufheben();
    const hs = HOF.filter(h => keys.includes(h.key)), els = [];
    hs.forEach(h => h.ziel.forEach(sel => svg.querySelectorAll(sel).forEach(e => els.push(e))));
    markieren(els);
    if (q.value){ q.value = ""; filtern(); }
    const gewaehlt = rows.filter(r => r.hof && keys.includes(r.hof.key));
    gewaehlt.forEach(r => r.b.classList.add("sel"));
    sichtbarMachen(gewaehlt[0] && gewaehlt[0].b);
    zeigeInfo(hs.map(h => ({name: h.name})));
    if (chip) chip.setAttribute("aria-pressed", "true");
    hinfliegen(els);
  }
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    if (c.getAttribute("aria-pressed") === "true"){ aufheben(); return; }
    waehleHof(CHIPS[c.dataset.key], false, c);
  }));

  /* ---------- Gesten auf der Karte ---------- */
  const finger = new Map();
  let start = null, letzterTap = 0, mehrfinger = false, gezogen = false;
  svg.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    messen(); cancelAnimationFrame(anim); tippWeg();
    try { svg.setPointerCapture(e.pointerId); } catch (_){}
    finger.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (finger.size === 1){ start = {x: e.clientX, y: e.clientY, ziel: e.target}; mehrfinger = false; gezogen = false; }
    else mehrfinger = true;
  });
  svg.addEventListener("pointermove", e => {
    const p = finger.get(e.pointerId); if (!p) return;
    if (finger.size === 1){
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 7) gezogen = true;
      if (gezogen){ const s = s0 * view.z; view.cx -= dx / s; view.cy -= dy / s; zeichnen(); }
      p.x = e.clientX; p.y = e.clientY;
    } else if (finger.size === 2){
      const [a, b] = [...finger.values()];
      const d0 = Math.hypot(a.x - b.x, a.y - b.y), m0 = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      p.x = e.clientX; p.y = e.clientY;
      const d1 = Math.hypot(a.x - b.x, a.y - b.y), m1 = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      const anker = zuKarte(m0.x, m0.y);
      view.z = Math.min(ZMAX, Math.max(1, view.z * (d0 > 0 ? d1 / d0 : 1)));
      const s = s0 * view.z;
      view.cx = anker.x - (m1.x - box.l - box.w / 2) / s;
      view.cy = anker.y - (m1.y - box.t - box.h / 2) / s;
      zeichnen();
    }
  });
  function los(e){
    if (!finger.has(e.pointerId)) return;
    finger.delete(e.pointerId);
    if (finger.size === 0 && start && !mehrfinger && !gezogen && e.type === "pointerup"){
      const jetzt = performance.now(), g = start.ziel.closest && start.ziel.closest(".st");
      if (g){ waehleStand(g, false); letzterTap = 0; }
      else if (jetzt - letzterTap < 320){ zoomAnim(e.clientX, e.clientY, 2); letzterTap = 0; }
      else { letzterTap = jetzt; if (svg.classList.contains("has-sel")) aufheben(); }
    }
    if (finger.size === 0) start = null;
  }
  svg.addEventListener("pointerup", los);
  svg.addEventListener("pointercancel", los);
  svg.addEventListener("wheel", e => { e.preventDefault(); messen(); zoomUm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0016)); }, {passive: false});
  ["gesturestart", "gesturechange"].forEach(t => svg.addEventListener(t, e => e.preventDefault()));
  function zoomAnim(px, py, faktor){
    messen();
    const m = zuKarte(px, py), z = Math.min(ZMAX, Math.max(1, view.z * faktor)), s = s0 * z;
    fliegen({cx: m.x - (px - box.l - box.w / 2) / s, cy: m.y - (py - box.t - box.h / 2) / s, z}, 260);
  }
  $("#zin").addEventListener("click", () => { messen(); zoomAnim(box.l + box.w / 2, box.t + box.h / 2, 1.7); });
  $("#zout").addEventListener("click", () => { messen(); zoomAnim(box.l + box.w / 2, box.t + box.h / 2, 1 / 1.7); });
  $("#zall").addEventListener("click", () => { messen(); fliegen({cx: W / 2, cy: H / 2, z: 1}, 350); });

  /* ---------- Suche ---------- */
  function filtern(){
    const s = norm(q.value.trim());
    leeren.hidden = !s;
    let nS = 0, nH = 0;
    rows.forEach(r => {
      let ok = !s;
      if (s) ok = /^\d+$/.test(s) ? (r.n !== undefined && String(r.n).startsWith(s)) : r.text.includes(s);
      r.li.hidden = !ok;
      if (ok) (r.n !== undefined ? nS++ : nH++);
    });
    $("#h-staende").hidden = !nS; $("#h-hof").hidden = !nH; $("#leer").hidden = !!(nS + nH);
    liste.scrollTop = 0;
  }
  q.addEventListener("input", filtern);
  q.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const sichtbar = rows.filter(r => !r.li.hidden);
    if (sichtbar.length === 1) sichtbar[0].b.click(); else q.blur();
  });
  leeren.addEventListener("click", () => { q.value = ""; filtern(); q.focus(); });

  /* Auf dem Handy verdeckt die Tastatur die halbe Seite: Karte so lange ausblenden */
  const schmal = matchMedia("(max-width: 899px)");
  let blurTimer = 0;
  function tippenAus(){
    clearTimeout(blurTimer);
    if (!app.classList.contains("tippt")) return;
    app.classList.remove("tippt"); fertig.hidden = true;
    if (document.activeElement === q) q.blur();
    if (messen()) zeichnen();
  }
  q.addEventListener("focus", () => { clearTimeout(blurTimer); if (schmal.matches){ app.classList.add("tippt"); fertig.hidden = false; } });
  q.addEventListener("blur", () => { blurTimer = setTimeout(tippenAus, 350); });
  fertig.addEventListener("click", tippenAus);

  /* ---------- Schnee wie auf der Website ---------- */
  (function(){
    const c = $("#schnee"), n = innerWidth < 700 ? 34 : 64;
    for (let i = 0; i < n; i++){
      const f = document.createElement("i"), d = (1.5 + Math.random() * 4.5).toFixed(1);
      f.style.cssText = "left:" + (Math.random() * 100).toFixed(2) + "%;width:" + d + "px;height:" + d + "px;opacity:" + (0.12 + Math.random() * 0.5).toFixed(2) +
        ";--dx:" + (Math.random() * 16 - 8).toFixed(1) + "vw;animation-duration:" + (10 + Math.random() * 20).toFixed(1) + "s;animation-delay:-" + (Math.random() * 30).toFixed(1) + "s" +
        (ruhig ? ";top:" + (Math.random() * 100).toFixed(1) + "%" : "");
      c.appendChild(f);
    }
  })();

  /* ---------- Start ---------- */
  if ("ResizeObserver" in window) new ResizeObserver(() => { if (messen()) zeichnen(); }).observe(karte);
  addEventListener("resize", () => { if (messen()) zeichnen(); });
  messen(); zeichnen(); tipp();
})();
</script>
</body>
